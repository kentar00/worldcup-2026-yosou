name: Update WC odds
on:
  schedule:
    # UTC. JST = UTC+9.  05:00→JST14:00 / 13:00→JST22:00 / 21:00→翌JST06:00
    - cron: '0 5,13,21 * * *'
  workflow_dispatch: {}   # 手動実行ボタンも有効
permissions:
  contents: write
jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch & update odds.json
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_SPORT: soccer_fifa_world_cup
          ODDS_REGIONS: eu
        run: node scripts/odds.mjs
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add odds.json
          git commit -m "auto: update odds $(date -u +%FT%TZ)" || echo "no changes"
          git push

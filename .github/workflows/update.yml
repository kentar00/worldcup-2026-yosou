name: Update WC results
on:
  schedule:
    # UTC. JST = UTC+9.  06:00→JST15:00 / 14:00→JST23:00 / 22:00→翌JST07:00
    - cron: '0 6,14,22 * * *'
  workflow_dispatch: {}   # 手動実行ボタンも有効
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch & update results.json
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          COMP_CODE: WC
        run: node scripts/update.mjs
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          git commit -m "auto: update results $(date -u +%FT%TZ)" || echo "no changes"
          git push

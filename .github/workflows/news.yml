name: Update Japan news
on:
  schedule:
    # UTC. JST = UTC+9.  23:00→JST08:00 / 04:00→JST13:00 / 10:00→JST19:00
    - cron: '0 23,4,10 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch & update news.json
        env:
          NEWS_QUERIES: 'サッカー日本代表 分析,サッカー日本代表 戦術,サッカー日本代表 スタメン予想,サッカー日本代表 プレビュー,森保ジャパン 練習,サッカー日本代表 コラム'
          NEWS_MAX: '20'
        run: node scripts/news.mjs
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "auto: update news $(date -u +%FT%TZ)" || echo "no changes"
          git push
